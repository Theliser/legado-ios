name: Build Test Package

on:
  push:
    branches: [ test ]
  workflow_dispatch:
    inputs:
      include_simulator:
        description: 'Build & package Simulator .app.zip as well'
        required: false
        type: boolean
        default: false

jobs:
  build-and-package:
    name: Build & Package Test Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          brew install xcodegen swiftlint swiftformat xcbeautify

      - name: Check code formatting & linting
        run: |
          make format-check

      - name: Generate Xcode project
        run: |
          make generate

      - name: Run Unit Tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          fi
          echo "Using simulator device ID: $DEVICE_ID"
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:LegadoTests \
            test | xcbeautify

      - name: Build Release Archive (Unsigned iOS Device)
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Legado.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | xcbeautify

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Legado.xcarchive/Products/Applications/Legado.app build/Payload/
          cd build
          zip -r -q Legado-Test.ipa Payload
          ls -lh Legado-Test.ipa

      - name: Upload Test IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-Test-IPA-${{ github.sha }}
          path: build/Legado-Test.ipa
          retention-days: 14

      - name: Build Simulator App (Optional)
        if: ${{ inputs.include_simulator == true }}
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/DerivedData \
            build | xcbeautify
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          zip -r -q ../../../Legado-Simulator.zip Legado.app

      - name: Upload Simulator App Artifact
        if: ${{ inputs.include_simulator == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Legado-Simulator-App-${{ github.sha }}
          path: build/Legado-Simulator.zip
          retention-days: 14

      - name: Publish GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="test-$(date +'%Y%m%d-%H%M')-${SHORT_SHA}"

          FILES=()
          if [ -f "build/Legado-Test.ipa" ]; then
            FILES+=("build/Legado-Test.ipa#Legado-Test-${SHORT_SHA}.ipa")
          fi
          if [ -f "build/Legado-Simulator.zip" ]; then
            FILES+=("build/Legado-Simulator.zip#Legado-Simulator-${SHORT_SHA}.zip")
          fi

          python3 -c "
          import os, datetime
          sha = '${{ github.sha }}'
          short_sha = sha[:7]
          tag = '${TAG_NAME}'
          repo = '${{ github.repository }}'
          ref = '${{ github.ref_name }}'
          date_str = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')

          notes = f'''### 🚀 Legado iOS Test Build ({tag})
          - **Commit**: [\`{short_sha}\`](https://github.com/{repo}/commit/{sha})
          - **Branch**: \`{ref}\`
          - **Date**: {date_str}

          #### 📦 Release Assets
          - **\`Legado-Test-{short_sha}.ipa\`**: Unsigned IPA (适用于 TrollStore / 巨魔、AltStore、SideStore 或个人证书自签名安装)
          '''

          if os.path.exists('build/Legado-Simulator.zip'):
              notes += f'- **\`Legado-Simulator-{short_sha}.zip\`**: iOS 模拟器专用的 App 压缩包\n'

          # Strip 10-space YAML indentation from each line
          clean_lines = [line.strip() for line in notes.strip().split('\n')]
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(clean_lines) + '\n')
          "

          gh release create "$TAG_NAME" "${FILES[@]}" \
            --target "${{ github.sha }}" \
            --title "Test Build ${TAG_NAME}" \
            --notes-file release_notes.md \
            --prerelease
