name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          brew install xcodegen swiftlint swiftformat xcbeautify

      - name: Check code formatting & linting
        run: |
          make format-check

      - name: Generate Xcode project
        run: |
          make generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -destination 'generic/platform=iOS Simulator' \
            clean build | xcbeautify
