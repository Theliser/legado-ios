name: Legado

options:
  bundleIdPrefix: io.github.theliser
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.5
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: 2.4.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Legado:
    type: application
    platform: iOS
    sources:
      - path: Legado
    dependencies:
      - package: SwiftSoup
      - package: Factory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.theliser.legado
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Legado/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if which swiftlint >/dev/null 2>&1; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        basedOnDependencyAnalysis: false

  LegadoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LegadoTests
    dependencies:
      - target: Legado
      - package: SwiftSoup
      - package: Factory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.theliser.legadotests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: LegadoTests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  LegadoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LegadoUITests
    dependencies:
      - target: Legado
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.theliser.legadouitests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TEST_TARGET_NAME: Legado
    info:
      path: LegadoUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  Legado:
    build:
      targets:
        Legado: all
        LegadoTests: [test]
        LegadoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LegadoTests
        - LegadoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
